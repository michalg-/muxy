name: Dev Build

on:
  push:
    branches: [ci/dev-build]

jobs:
  build:
    name: Build unsigned app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(grep '^xcode ' .tool-versions | awk '{print $2}').app"

      - name: Setup GhosttyKit
        run: scripts/setup.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build app
        run: scripts/build-release.sh --arch arm64 --version 0.0.0

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/Muxy.app

      - name: Package app
        run: ditto -c -k --keepParent build/Muxy.app build/Muxy-dev-arm64.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Muxy-dev-arm64
          path: build/Muxy-dev-arm64.zip
          retention-days: 7
